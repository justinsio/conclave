name: CI
on:
  push:
    # feat/** included deliberately: work happens on feature branches, and a
    # master-only trigger means a branch can never be proven green before merge.
    branches: [master, 'feat/**']
    # A full run is ~26 minutes on this runner (measured: run #61, 10:01 -> 10:27).
    # Three docs-only commits in one day cost ~78 minutes of runner time to prove
    # that markdown did not break Python.
    #
    # 🔑 paths-ignore, NOT paths. They fail in opposite directions:
    #   paths:        an ALLOWLIST — a pattern that matches nothing means CI NEVER RUNS.
    #   paths-ignore: a DENYLIST  — a pattern that matches nothing means CI ALWAYS RUNS.
    # Only the second is safe to get wrong. A skip is granted only when EVERY
    # changed file in the push matches, so one .py alongside ten .md still runs.
    #
    # Every entry below is documentation. Verified 2026-08-03 that no markdown
    # file in this repo is load-bearing: the only file-reading setting is
    # `rules_file` (app/config.py), which defaults to "" and ships empty in
    # .env.example, so nothing in the suites reads a .md.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

jobs:
  test:
    runs-on: homelab
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        # Verified on this runner 2026-08-03 (Docker 20.10.24, Compose 5.3.1):
        #   no .env            -> exit 1  "POSTGRES_PASSWORD variable is not set"
        #   valid + throwaway  -> exit 0
        #   broken compose.yaml-> exit 1  "services.api.ports must be a array"
        # The third case is the one that matters: a validation step that cannot
        # fail is decoration.
        run: |
          # Written as .env, NOT passed via --env-file. --env-file replaces only
          # the INTERPOLATION source; compose still stats the literal `env_file: .env`
          # path that api and migrate declare, and errors "env file not found".
          # One file satisfies both. .env is gitignored, so nothing leaks.
          printf 'POSTGRES_PASSWORD=ci-throwaway\nADMIN_API_KEY=ci-throwaway\n' > .env
          # trap, not a trailing rm: on failure the shell exits before any later
          # line, and a stray .env in a persistent self-hosted workspace would be
          # picked up by conftest's load_dotenv() on the next run.
          trap 'rm -f .env' EXIT
          # > /dev/null is REQUIRED, not tidiness. `config` inlines env_file
          # contents verbatim — measured: 7 occurrences of the resolved secrets
          # in stdout on this exact file. A CI log is the last place those belong.
          docker compose config > /dev/null

      - name: Set up venv (Python 3.12)
        run: |
          uv venv .venv --python 3.12 --seed
          .venv/bin/pip install -r requirements.txt

      - name: Lint + security scan
        # B608 skipped: all SQL uses asyncpg $n params; flagged f-strings assemble
        # static fragments only (allowlisted tables, Pydantic field names, explicit
        # column maps) — each finding individually verified 2026-07-03.
        run: |
          .venv/bin/pip install -q "ruff==0.15.20" "bandit==1.9.4"
          .venv/bin/python -m ruff check .
          .venv/bin/python -m bandit -r app scripts -q -s B608
          # Separate invocation on purpose: B608 above is documented as
          # individually verified for backend asyncpg SQL only. Folding these
          # targets into that call would silently extend the skip to code
          # nobody audited for it.
          # NO leading "./" on the exclude paths — that form silently matches
          # nothing (verified: 136 findings / 39 files with it, 0 / 21 without),
          # so bandit would flood on B101 assert_used in the test modules.
          .venv/bin/python -m bandit -r seeds dashboard -x seeds/tests,dashboard/tests -q

      - name: Ensure test database
        run: |
          PGPASSWORD=postgres createdb -h localhost -U postgres conclave_test 2>/dev/null || true

      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/conclave_test
        run: .venv/bin/python -m pytest -q

      - name: Install sub-project dependencies
        # streamlit stays pinned <1.50: newer releases need starlette>=0.40,
        # which conflicts with fastapi 0.115 — and all three projects share
        # this one venv in CI even though containers separate them at runtime.
        run: |
          .venv/bin/pip install -r seeds/requirements.txt
          .venv/bin/pip install -r dashboard/requirements.txt -r dashboard/requirements-dev.txt
          # Three sequential installs cannot backtrack across each other, so an
          # inconsistent environment can pass all three. Fail loudly instead.
          .venv/bin/pip check

      - name: Run seeds suite
        run: .venv/bin/python -m pytest seeds/ -q

      - name: Run dashboard suite
        run: .venv/bin/python -m pytest dashboard/ -q
