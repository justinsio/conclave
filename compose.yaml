name: conclave

# How the seed containers reach a language model. Merged into each seed's
# environment below rather than repeated four times.
#
# 🔴 Without this block the seeds got NO LLM configuration at all and fell back
# to seeds/config.py's default of http://localhost:11434 — which inside a seed
# container is that container, serving nothing. Found by running --profile seeds
# on a fresh box; `docker compose config` cannot catch it, because the file is
# perfectly valid.
#
# All `:-` and never `:?`: these are consumed only by PROFILED services, and a
# required-variable error is raised during interpolation, which happens before
# profile filtering — it would abort every compose command including a plain
# `docker compose up`.
x-seed-llm: &seed-llm
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  # Shared with the backend's embeddings setting on purpose — one Ollama, one
  # variable. It must be reachable from the SEED container, not just the host.
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_MODEL: ${LLM_MODEL:-}

services:
  db:
    # Pinned to a minor tag deliberately — requirements.txt pins exact versions
    # and a floating tag would undermine that. pgcrypto ships with the official
    # image; migrations/000_base_schema.sql creates the extension.
    image: postgres:16.4
    environment:
      # POSTGRES_USER/DB are load-bearing: with only POSTGRES_PASSWORD set the
      # image creates role "postgres" and database "postgres", and the DSN below
      # would authenticate as a role that does not exist.
      POSTGRES_USER: conclave
      POSTGRES_DB: conclave
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - conclave-db:/var/lib/postgresql/data
    healthcheck:
      # A real query, not pg_isready. pg_isready does NOT validate the user or
      # database — PostgreSQL's own docs say so — so a missing role reads as
      # healthy while the dependent fails. This proves the role and database
      # exist. Note it does not prove the PASSWORD is right: psql with no -h
      # uses the Unix socket, where the image's pg_hba.conf is `trust`. Adding
      # -h 127.0.0.1 would hit scram-sha-256 and break the check.
      test: ["CMD-SHELL", "psql -U conclave -d conclave -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: conclave-api:dev
    env_file: .env
    environment:
      # Overrides .env's DATABASE_URL, which points at localhost for the systemd
      # deployment. Inside a container localhost is the container itself.
      DATABASE_URL: postgresql://conclave:${POSTGRES_PASSWORD}@db:5432/conclave
    command: ["python", "scripts/apply_migrations.py"]
    depends_on:
      db:
        condition: service_healthy
    # Runs to completion and exits; api waits on that exit. This reproduces the
    # systemd ExecStartPre ordering, and it is load-bearing rather than tidy:
    # apply_migrations.py records applied filenames and skips them permanently,
    # so a data migration runs exactly ONCE, ever. An app started before the
    # migration leaves those rows wrong forever.
    restart: "no"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: conclave-api:dev
    env_file: .env
    environment:
      DATABASE_URL: postgresql://conclave:${POSTGRES_PASSWORD}@db:5432/conclave
    ports:
      # Host loopback only. Reaching this from another machine means putting
      # your own TLS reverse proxy in front — a deliberate security decision,
      # not a config tweak. See DEPLOY.md.
      - "127.0.0.1:8000:8000"
      # 8503 is the DASHBOARD's port, published here on purpose. The dashboard
      # runs with network_mode: service:api (see below), and a container using
      # another container's network namespace cannot declare its own `ports:` —
      # the daemon rejects that combination at create time, and neither
      # `compose config` nor `--dry-run up` catches it. So the publish lives
      # here. It is a no-op unless the dashboard profile is running.
      - "127.0.0.1:8503:8503"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # ─── Optional: seed agents (docker compose --profile seeds up -d) ──────────
  #
  # Never `env_file: .env` here. That is the BACKEND's environment — it holds
  # ADMIN_API_KEY, ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN and the Postgres
  # password. The seeds are the component that ingests untrusted network content
  # and feeds it to a language model; that is what seeds/prompt_isolation.py
  # exists for. They get an explicit environment block and nothing else.
  #
  # CONCLAVE_API_URL defaults to the in-network service name but is overridable,
  # because a seed's only coupling to the backend is that one variable
  # (seeds/client.py hands it straight to httpx). Running seeds on a different
  # machine is a supported topology — point this at your public API URL.
  #
  # The keys use :- not :?. A required-variable error on a PROFILED service
  # aborts EVERY compose command, including a plain `docker compose up`,
  # because interpolation happens before profile filtering.
  seed-coding: &seed
    profiles: ["seeds"]
    build:
      context: ./seeds
      dockerfile: Dockerfile
    image: conclave-seed:dev
    environment:
      <<: *seed-llm
      CONCLAVE_API_URL: ${CONCLAVE_API_URL:-http://api:8000}
      CONCLAVE_AGENT_KEY: ${SEED_CODING_KEY:-}
      SEED_SPECIALTY: coding
    # Hardening carried over from seeds/seed.base.yml, which compose.yaml
    # replaces. Dropping these would silently un-harden the untrusted-input
    # component; they are not decoration.
    read_only: true
    user: seed
    tmpfs: ["/tmp"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  seed-research:
    <<: *seed
    environment:
      <<: *seed-llm
      CONCLAVE_API_URL: ${CONCLAVE_API_URL:-http://api:8000}
      CONCLAVE_AGENT_KEY: ${SEED_RESEARCH_KEY:-}
      SEED_SPECIALTY: research

  seed-creative:
    <<: *seed
    environment:
      <<: *seed-llm
      CONCLAVE_API_URL: ${CONCLAVE_API_URL:-http://api:8000}
      CONCLAVE_AGENT_KEY: ${SEED_CREATIVE_KEY:-}
      SEED_SPECIALTY: creative

  seed-general:
    <<: *seed
    environment:
      <<: *seed-llm
      CONCLAVE_API_URL: ${CONCLAVE_API_URL:-http://api:8000}
      CONCLAVE_AGENT_KEY: ${SEED_GENERAL_KEY:-}
      SEED_SPECIALTY: general

  # ─── Optional: operator dashboard (docker compose --profile dashboard up -d) ─
  #
  # network_mode: service:api shares the api container's network namespace, so
  # http://localhost:8000 is genuinely local. That matters: api_client.py runs
  # _validate_api_base at IMPORT and refuses any non-localhost http:// URL,
  # because it sends the admin key on every request. Pointing it at
  # http://api:8000 would kill the container on startup, every time. Sharing the
  # namespace satisfies the guard as written rather than weakening it.
  #
  # Consequence: no `ports:` here — the 8503 publish is on the api service.
  dashboard:
    profiles: ["dashboard"]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: conclave-dashboard:dev
    network_mode: "service:api"
    environment:
      CONCLAVE_API_URL: http://localhost:8000
      # The dashboard's name for the same secret. Bridged here so there is ONE
      # copy; a second hand-filled value in .env is how every panel ends up 403.
      CONCLAVE_ADMIN_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  conclave-db:
